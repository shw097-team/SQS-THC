# SUPPLY CHAIN PINS - supply-chain/pins.yaml (TS-011 / ART-11, CH32 / TOOL registry).
# TOOL card format: an ADOPT tool carries pin UNRESOLVED::TOOL-xx::PIN and
# status BLOCKED_PENDING_QUALIFICATION until the exact pin is resolved with
# reliable local/dual-source evidence. ADOPT/ADAPT is a design selection, not
# an installation or admission; no tool is executed on an unresolved pin.
